# To minimize vendor key leaks, virtual keys are produced 
# and given to different teams. Badget and control with easy
model_list:
  - model_name: fast
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: low
  - model_name: smart     # more thinking: slower, more tokens, better on hard tasks
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: high

router_settings:
  fallbacks: [{"smart": ["fast"]}]
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL