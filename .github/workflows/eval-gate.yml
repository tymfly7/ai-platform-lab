name: eval-gate
on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start gateway and database
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          sed -i '/callbacks:/d; /^litellm_settings:/d' gateway/config.yaml   # no tracing in CI
          docker compose up -d
          until curl -sf localhost:4000/health/liveliness; do sleep 3; done

      - name: Issue a CI key, ingest, start the RAG API
        working-directory: services/rag-api
        run: |
          set -a; source ../../.env; set +a
          export TEAM_KEY=$(curl -s localhost:4000/key/generate \
            -H "Authorization: Bearer $LITELLM_MASTER_KEY" -H "Content-Type: application/json" \
            -d '{"key_alias":"ci","models":["fast"],"max_budget":0.5}' | jq -r .key)
          uv run python ingest.py
          nohup uv run uvicorn app:app --port 8001 > rag.log 2>&1 &
          until curl -sf localhost:8001/healthz; do sleep 3; done

      - name: Run evals (fails the PR on any failed case)
        run: npx promptfoo@latest eval -c evals/promptfooconfig.yaml --repeat 3